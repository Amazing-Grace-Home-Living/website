name: Export Logs to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # daily at 04:00 UTC

jobs:
  export-logs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: 'projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'export-logs-sa@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com'
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-cloud-secret-manager gspread oauth2client

      - name: Run export script
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          SECRET_NAME: firestore-exporter-key
        run: |
          python lib/export_logs_to_sheets.py
