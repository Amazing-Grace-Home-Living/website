name: Vercel Preview & Playwright Test Dashboard

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  # 🚀 Step 1: Deploy Ephemeral Staging Layer to Vercel
  deploy-preview:
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy Preview to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: true

  # 🎭 Step 2: Run Playwright Test Suite Against Vercel Preview
  playwright-e2e:
    needs: deploy-preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests Against Vercel Staging
        env:
          VERCEL_URL: ${{ needs.deploy-preview.outputs.preview-url }}
          CI: true
        run: npx playwright test

      # 📊 Step 3: Archive Retried Video Recordings & Traces on Failure
      - name: Upload Playwright Diagnostic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-preview-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
