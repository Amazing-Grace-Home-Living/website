name: Deploy & Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # needed for Firebase token if using GCP auth

jobs:
  build-and-deploy:
    name: Build & Deploy (GitHub Pages + Firebase)
    runs-on: ubuntu-latest
    steps:
      # Checkout repo
      - uses: actions/checkout@v4

      # Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install deps
      - name: Install dependencies
        run: npm ci

      # Build site (adjust if your build command differs)
      - name: Build site
        run: npm run build

      # ----- GitHub Pages Deploy (existing) -----
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          WORK=$(mktemp -d)
          if git rev-parse --verify origin/gh-pages > /dev/null 2>&1; then
            git worktree add --detach "$WORK" origin/gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
            touch "$WORK/.nojekyll"
          fi

          rsync -a --delete --exclude='.git' --exclude='pr-*/' dist/ "$WORK/"
          cd "$WORK"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "deploy: ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          else
            echo "Nothing changed, skipping push."
          fi

      # ----- Firebase Hosting Deploy -----
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          # Optional: select project explicitly
          firebase use $FIREBASE_PROJECT_ID
          firebase deploy --only hosting --project $FIREBASE_PROJECT_ID --token "$FIREBASE_TOKEN"
