name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy GitHub Pages
    runs-on: ubuntu-latest
    steps:
      # Checkout repo
      - uses: actions/checkout@v4

      # Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install deps
      - name: Install dependencies
        run: npm ci

      # Build site (adjust if your build command differs)
      - name: Build site
        run: npm run build

      # ----- GitHub Pages Deploy (existing) -----
      - name: Deploy to GitHub Pages
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          WORK=$(mktemp -d)
          if git ls-remote --exit-code --heads origin refs/heads/gh-pages >/dev/null; then
            git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git worktree add --detach "$WORK" origin/gh-pages
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          rsync -a --delete --exclude='.git' --exclude='pr-*/' dist/ "$WORK/"
          touch "$WORK/.nojekyll"
          cd "$WORK"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "deploy: ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          else
            echo "Nothing changed, skipping push."
          fi

