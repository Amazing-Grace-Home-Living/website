# Optional fallback only. Vercel deploys production automatically.
# Do not run this on every push: a missing service-account secret is not CI.
name: Firebase Hosting (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optional-firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify optional deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.Service_Account_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Service_Account_JSON is not configured. Vercel remains the primary deployment."
            exit 1
          fi
      - name: Deploy static Hosting only (not Firestore/Storage rules)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ github.token }}
          firebaseServiceAccount: ${{ secrets.Service_Account_JSON }}
          projectId: amazing-grace-hl
          channelId: live
