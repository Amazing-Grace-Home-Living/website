<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LMS Dashboard – Amazing Grace</title>
  <script src="https://esm.sh/react@18/umd/react.production.min.js"></script>
  <script src="https://esm.sh/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    .lms-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .lms-welcome {
      margin-top: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import AuthForm from "../src/AuthForm.jsx";
    import ChatRoom from "../src/ChatRoom.jsx";
    import PointsWallet from "../src/PointsWallet.jsx";

    const root = ReactDOM.createRoot(document.getElementById('app'));

    root.render(
      React.createElement('div', { className: 'lms-grid' },
        React.createElement('div', { id: 'auth-form-mount' }, React.createElement(AuthForm)),
        React.createElement('div', { id: 'points-wallet-mount' }, React.createElement(PointsWallet)),
        React.createElement('div', { id: 'chat-room-mount' }, React.createElement(ChatRoom, { roomId: 'general' }))
      )
    );

    const welcome = document.createElement('section');
    welcome.className = 'lms-welcome';
    welcome.innerHTML = `
      <h2>Welcome, <span id="user-name">User</span>!</h2>
      <button id="logout-button" type="button">Logout</button>
    `;
    document.body.appendChild(welcome);

    document.getElementById('logout-button')?.addEventListener('click', () => {
      if (window.firebase && window.firebase.auth) {
        window.firebase.auth().signOut().then(() => location.reload());
      }
    });
  </script>
</body>
</html>
