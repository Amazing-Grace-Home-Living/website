steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_DEPLOY_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:$BUILD_ID', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_DEPLOY_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:$BUILD_ID']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_DEPLOY_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:$BUILD_ID'
      - '--region=${_DEPLOY_REGION}'
      - '--project=$PROJECT_ID'
      - '--quiet'
substitutions:
  _DEPLOY_REGION: us-central1
  _SERVICE_NAME: amazing-grace
options:
  logging: CLOUD_LOGGING_ONLY
